name: 'Flaky Triager'
description: 'Triage flaky and broken tests from JUnit XML and post a PR comment explaining each failure.'
author: 'ronak.ray@doubleverify.com'

inputs:
  github-token:
    description: 'GitHub token with pull_request: write and actions: read scopes.'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key used by the LLM analyzer.'
    required: true
  artifact-name:
    description: 'Name of the JUnit XML artifact to download from the triggering workflow run.'
    required: false
    default: 'test-results'
  results-dir:
    description: 'Optional local path containing JUnit XML files. If set, the Action skips artifact download and reads from here directly.'
    required: false
    default: ''
  firestore-credentials:
    description: 'Optional Google service account JSON (as a single-line string, typically stored in a secret) for persisting test-run history to Firestore. If omitted or invalid, the Action runs without history — current-run signals are used as-is and the inconclusive→flaky/real_break upgrade rules will not fire.'
    required: false
    default: ''
  firestore-project-id:
    description: 'Optional Google Cloud project ID for Firestore. If omitted, the project_id from firestore-credentials is used.'
    required: false
    default: ''
  firestore-database-id:
    description: 'Firestore database ID. Defaults to "(default)". Set to your database name if you created Firestore with a non-default ID.'
    required: false
    default: '(default)'
  history-limit:
    description: 'How many recent runs to load per test when augmenting verdicts.'
    required: false
    default: '10'

outputs:
  flaky-count:
    description: 'Number of tests classified as flaky.'
  break-count:
    description: 'Number of tests classified as real breaks.'
  inconclusive-count:
    description: 'Number of tests with an inconclusive verdict.'
  report-markdown:
    description: 'Full markdown report posted to the PR (also available in the workflow logs).'

runs:
  using: 'node20'
  main: 'dist/action.cjs'
