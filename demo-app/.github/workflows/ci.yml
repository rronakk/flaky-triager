name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare results directory
        run: mkdir -p test-results

      - name: Run vitest (unit, integration, API)
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit-vitest.xml
        continue-on-error: true

      - name: Debug — list test-results after vitest
        if: always()
        run: |
          echo "--- ls -la test-results ---"
          ls -la test-results/ || echo "test-results missing"
          echo "--- head junit-vitest.xml ---"
          head -3 test-results/junit-vitest.xml 2>/dev/null || echo "junit-vitest.xml missing"

      - name: Build frontend
        run: npm run build:client

      - name: Run E2E tests
        run: npx playwright test
        continue-on-error: true

      - name: Debug — list test-results after e2e
        if: always()
        run: |
          echo "--- ls -la test-results ---"
          ls -la test-results/ || echo "test-results missing"

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Triage flaky tests
        if: always() && github.event_name == 'pull_request'
        uses: rronakk/flaky-triager@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          results-dir: test-results
