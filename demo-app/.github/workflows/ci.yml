name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare results directory
        run: mkdir -p test-results

      - name: Run vitest (unit, integration, API)
        run: npx vitest run
        continue-on-error: true

      - name: Build frontend
        run: npm run build:client

      - name: Run E2E tests
        run: npx playwright test
        continue-on-error: true

      - name: Filter quarantined failures from JUnit XML
        if: always()
        run: |
          curl -sSL https://raw.githubusercontent.com/rronakk/flaky-triager/main/dist/filter-junit.cjs -o /tmp/filter-junit.cjs
          node /tmp/filter-junit.cjs test-results .flaky-quarantine.json

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Triage flaky tests
        if: always() && github.event_name == 'pull_request'
        uses: rronakk/flaky-triager@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          firestore-credentials: ${{ secrets.FIRESTORE_CREDENTIALS }}
          firestore-database-id: flaky
          results-dir: test-results
